estilo: sango

cerrable: false

timer: 60

fade_in: 0
fade_out: 0.5

# --- Fuente global ---
# Se puede sobreescribir por seccion con un "font:" dentro de la seccion (ver abajo).
#   minecraft (nativa, por defecto) | Arial | Helvetica | Verdana | Poppins | Saw.otf | Minecraft.otf
font: arial

timer_size: 36

imagenes:
  # - src: images/logo.png
  #   x: 0.5
  #   y: 0.12
  #   w: 0.18
  # - src: https://ejemplo.com/sello.gif
  #   x: 0.9
  #   y: 0.9
  #   w: 0.1

# Video del recuadro central. Puede ser:
#   - un archivo local en la carpeta ya existente config/mediaplayer/videos/  (ej: tutorial.mp4)
#   - una URL (http..., youtube, twitch, etc.)
#   - vacio ("")  -> el recuadro se muestra en NEGRO
video: ""

# --- Textos bilingues (es / en). El idioma se elige segun el idioma del cliente. ---
# En CUALQUIER texto puedes incrustar iconos internos con tokens entre llaves:
#   Teclas de letra:  {a} {b} {c} ... {z}  y  {ñ}
#   Mouse:            {lclick}  {rclick}
#   Simbolos:         {circle}  {cross}  {music}  {block}
#   Caras/cabezas:    {steve}  {happy}  {angry}
# Ejemplo:  "Muevete con {w}{a}{s}{d} y haz clic con {lclick}"

# Cada seccion admite "size:" (tamaño en px de diseno) y "font:" propios.
titulo:
  size: 50
  # font: Poppins
  es: "FORMAR PALABRAS"
  en: "FORM WORDS"

subtitulo:
  size: 34
  es: "Tutorial"
  en: "Tutorial"

titulo_controles:
  size: 30
  es: "Controles"
  en: "Controls"

instrucciones:
  size: 23
  es:
    - "&lObjetivo:&r"
    - "Descubre las cinco palabras correctas utilizando unicamente las letras disponibles."
    - ""
    - "&lPalabras:&r deberas encontrar todas las palabras ocultas que pueden formarse con las letras disponibles"
    - ""
    - "&lLetras:&r tienes varias letras desordenadas que serviran para formar todas las palabras"
    - ""
    - "&lInterfaz:&r en pantalla se mostrara la lista de palabras por descubrir y las letras que puedes utilizar"
    - ""
    - "&lVictoria:&r completa las cinco palabras para superar el nivel"
    - ""
  en:
    - "&lObjective:&r"
    - "Discover the five correct words using only the available letters."
    - ""
    - "&lWords:&r You must find all hidden words that can be formed using the available letters"
    - ""
    - "&lLetters:&r You have scrambled letters to use to form all the words"
    - ""
    - "&lInterface:&r The list of words to discover and the available letters will be displayed on the screen"
    - ""
    - "&lVictory:&r Complete all five words to beat the level"
    - ""
controles:
  size: 21
  es: "Selecciona las letras: {lclick}"
  en: "Select the letters: {lclick}"
