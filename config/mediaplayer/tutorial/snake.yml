estilo: sango

cerrable: false

timer: 60

fade_in: 0
fade_out: 0.5

# --- Fuente global ---
# Se puede sobreescribir por seccion con un "font:" dentro de la seccion (ver abajo).
#   minecraft (nativa, por defecto) | Arial | Helvetica | Verdana | Poppins | Saw.otf | Minecraft.otf
font: arial

timer_size: 36

imagenes:
  # - src: images/logo.png
  #   x: 0.5
  #   y: 0.12
  #   w: 0.18
  # - src: https://ejemplo.com/sello.gif
  #   x: 0.9
  #   y: 0.9
  #   w: 0.1

# Video del recuadro central. Puede ser:
#   - un archivo local en la carpeta ya existente config/mediaplayer/videos/  (ej: tutorial.mp4)
#   - una URL (http..., youtube, twitch, etc.)
#   - vacio ("")  -> el recuadro se muestra en NEGRO
video: ""

# --- Textos bilingues (es / en). El idioma se elige segun el idioma del cliente. ---
# En CUALQUIER texto puedes incrustar iconos internos con tokens entre llaves:
#   Teclas de letra:  {a} {b} {c} ... {z}  y  {ñ}
#   Mouse:            {lclick}  {rclick}
#   Simbolos:         {circle}  {cross}  {music}  {block}
#   Caras/cabezas:    {steve}  {happy}  {angry}
# Ejemplo:  "Muevete con {w}{a}{s}{d} y haz clic con {lclick}"

# Cada seccion admite "size:" (tamaño en px de diseno) y "font:" propios.
titulo:
  size: 50
  # font: Poppins
  es: "SNAKE"
  en: "SNAKE"

subtitulo:
  size: 34
  es: "Tutorial"
  en: "Tutorial"

titulo_controles:
  size: 30
  es: "Controles"
  en: "Controls"

instrucciones:
  size: 22
  es:
    - "&lObjetivo:&r"
    - "Consume todas las frutas que puedas para hacer crecer a la"
    - "serpiente y conseguir la mayor puntuacion sin chocar."
    - ""
    - "&lMovimiento:&r la serpiente avanza de forma constante y solo puede cambiar de direccion en cuatro sentidos"
    - ""
    - "&lFrutas:&r aparecen aleatoriamente por el mapa; al comer una, la serpiente aumenta de tamaño"
    - ""
    - "&lChile:&r te da velocidad"
    - ""
    - "&lObstaculos:&r bloquean el camino y &lCUIDADO CON LAS MANZANAS PODRIDAS&r al comerte una de ellas te reduce la cola"
    - ""
    - "&lCuerpo:&r si la cabeza de la serpiente choca con su propia cola, mueres"
    - ""
  en:
    - "&lObjective:&r"
    - "Eat as much fruit as possible to grow the snake and"
    - "achieve the highest score without crashing."
    - ""
    - "&lMovement:&r The snake moves constantly and can only change direction in four ways"
    - ""
    - "&lFruit:&r Appears randomly on the map; eating a piece of fruit makes the snake grow"
    - ""
    - "&lChile:&r Gives you speed"
    - ""
    - "&lObstacles:&r Block the path. &lWATCH OUT FOR ROTTEN APPLES:&r eating one causes your tail to shrink"
    - ""
    - "&lBody:&r If the snake's head collides with its own tail, you die"
    - ""
controles:
  size: 21
  es: "Muevete con {w}{a}{s}{d}"
  en: "Move with {w}{a}{s}{d}"
