# ============================================================================
#  TUTORIAL DE EJEMPLO - MediaPlayer
#  Copia este archivo o crea otros .yml en config/mediaplayer/tutorial/
#  Mostralo con:  /playtutorial <jugadores> <nombre>     (ej: /playtutorial @a ejemplo)
#  Cierralo con:  /playtutorial stop <jugadores>
# ============================================================================

# Estilo visual de la pantalla:
#   decorado -> fondo de pergamino + madera con un recuadro de video (estilo principal)
#   vanilla  -> diseno simple y lineal en negro + rojo (estilo limpio)
estilo: decorado

# Si es false la pantalla NO se puede cerrar con ESC: solo se cierra cuando el timer
# llega a 0 (util para eventos donde todos deben ver el tutorial). Por defecto: true.
cerrable: true

# Cuenta atras en segundos. Al llegar a 0 la pantalla se cierra sola.
# Pon 0 para no mostrar timer ni autocerrar.
timer: 30

# Fundidos de entrada y salida en segundos.
fade_in: 0.5
fade_out: 0.5

# --- Fuente global ---
# Se puede sobreescribir por seccion con un "font:" dentro de la seccion (ver abajo).
#   minecraft (nativa, por defecto) | Arial | Helvetica | Verdana | Poppins | Saw.otf | Minecraft.otf
font: minecraft

# El TAMAÑO de cada seccion se define con "size:" DENTRO de la seccion (ver titulo, subtitulo,
# instrucciones, controles, etc. mas abajo). Ese valor define el tamaño de cada renglon.
# (Tambien funciona a nivel global con <seccion>_size: NN si lo prefieres.)
timer_size: 36

# --- Codigos de formato con & (colores y efectos de Minecraft) ---
# En cualquier texto puedes usar &<codigo>:
#   Colores: &0..&9 &a..&f   Efectos: &l negrita, &o cursiva, &n subrayado, &m tachado, &k oculto, &r reset
# Ej:  "&aTexto verde y &l&cnegrita roja&r normal"

# --- Imagenes superpuestas (encima de TODAS las capas) ---
# Cada imagen: src (local en config/mediaplayer/... o url), x/y = centro en fraccion 0..1,
# w = ancho en fraccion de pantalla, h = alto en fraccion (opcional; si falta mantiene proporcion).
# Las imagenes van en la carpeta ya existente config/mediaplayer/images (referencia: images/archivo.png).
imagenes:
  # - src: images/logo.png
  #   x: 0.5
  #   y: 0.12
  #   w: 0.18
  # - src: https://ejemplo.com/sello.gif
  #   x: 0.9
  #   y: 0.9
  #   w: 0.1

# Video del recuadro central. Puede ser:
#   - un archivo local en la carpeta ya existente config/mediaplayer/videos/  (ej: tutorial.mp4)
#   - una URL (http..., youtube, twitch, etc.)
#   - vacio ("")  -> el recuadro se muestra en NEGRO
video: ""

# --- Textos bilingues (es / en). El idioma se elige segun el idioma del cliente. ---
# En CUALQUIER texto puedes incrustar iconos internos con tokens entre llaves:
#   Teclas de letra:  {a} {b} {c} ... {z}  y  {ñ}
#   Mouse:            {lclick}  {rclick}
#   Simbolos:         {circle}  {cross}  {music}  {block}
#   Caras/cabezas:    {steve}  {happy}  {angry}
# Ejemplo:  "Muevete con {w}{a}{s}{d} y haz clic con {lclick}"

# Cada seccion admite "size:" (tamaño en px de diseno) y "font:" propios.
titulo:
  size: 50
  # font: Poppins
  es: "TITULO"
  en: "TITLE"

subtitulo:
  size: 34
  es: "Subtitulo del tutorial"
  en: "Tutorial subtitle"

titulo_controles:
  size: 30
  es: "Controles"
  en: "Controls"

# Texto largo: puedes usar una lista de lineas (cada "- " es una linea)
# o una sola cadena con \n para los saltos de linea.
instrucciones:
  size: 31
  es:
    - "Bienvenido al tutorial."
    - ""
    - "Lee con atencion las instrucciones de abajo"
    - "y observa el video del recuadro."
    - ""
    - "Cuando termines, pulsa ESC para cerrar."
  en:
    - "Welcome to the tutorial."
    - ""
    - "Read the instructions below carefully"
    - "and watch the video on the right."
    - ""
    - "When you are done, press ESC to close."

controles:
  size: 20
  es: "Muevete con {w}{a}{s}{d}   Saltar: ESPACIO   Interactuar: {rclick}   Romper: {lclick}"
  en: "Move with {w}{a}{s}{d}   Jump: SPACE   Interact: {rclick}   Break: {lclick}"
