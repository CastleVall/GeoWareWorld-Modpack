estilo: sango

cerrable: false

timer: 60

fade_in: 0
fade_out: 0.5

# --- Fuente global ---
# Se puede sobreescribir por seccion con un "font:" dentro de la seccion (ver abajo).
#   minecraft (nativa, por defecto) | Arial | Helvetica | Verdana | Poppins | Saw.otf | Minecraft.otf
font: arial

timer_size: 36

imagenes:
  # - src: images/logo.png
  #   x: 0.5
  #   y: 0.12
  #   w: 0.18
  # - src: https://ejemplo.com/sello.gif
  #   x: 0.9
  #   y: 0.9
  #   w: 0.1

# Video del recuadro central. Puede ser:
#   - un archivo local en la carpeta ya existente config/mediaplayer/videos/  (ej: tutorial.mp4)
#   - una URL (http..., youtube, twitch, etc.)
#   - vacio ("")  -> el recuadro se muestra en NEGRO
video: ""

# --- Textos bilingues (es / en). El idioma se elige segun el idioma del cliente. ---
# En CUALQUIER texto puedes incrustar iconos internos con tokens entre llaves:
#   Teclas de letra:  {a} {b} {c} ... {z}  y  {ñ}
#   Mouse:            {lclick}  {rclick}
#   Simbolos:         {circle}  {cross}  {music}  {block}
#   Caras/cabezas:    {steve}  {happy}  {angry}
# Ejemplo:  "Muevete con {w}{a}{s}{d} y haz clic con {lclick}"

# Cada seccion admite "size:" (tamaño en px de diseno) y "font:" propios.
titulo:
  size: 50
  # font: Poppins
  es: "TOMB OF MARKS"
  en: "TOMB OF MARKS"

subtitulo:
  size: 34
  es: "Tutorial"
  en: "Tutorial"

titulo_controles:
  size: 30
  es: "Controles"
  en: "Controls"

instrucciones:
  size: 23
  es:
    - "&lObjetivo:&r"
    - "Recolecta todas las llaves del laberinto para desbloquear la salida y completar el nivel."
    - ""
    - "&lMecanicas:&r"
    - ""
    - "&lMovimiento:&r al moverte seguiras avanzando sin parar hasta chocar con una pared u obstaculo"
    - ""
    - "&lParedes:&r detienen tu movimiento y definen el recorrido que puedes seguir"
    - ""
    - "&lObstaculos:&r bloquean el camino y obligan a buscar rutas alternativas"
    - ""
    - "&lReinicio:&r si quedas atrapado o cometes un error, puedes reiniciar rapidamente el nivel"
    - ""
  en:
    - "&lObjective:&r"
    - "Collect all the keys in the maze to unlock the exit and complete the level."
    - ""
    - "&lMechanics:&r"
    - ""
    - "&lMovement:&r When moving you will keep going non stopping until you hit a wall or obstacle"
    - ""
    - "&lWalls:&r They stop your movement and define the path you can take"
    - ""
    - "&lObstacles:&r They block the way and force you to find alternative routes"
    - ""
    - "&lRestart:&r If you get stuck or make a mistake, you can quickly restart the level"
    - ""
controles:
  size: 21
  es: "Muevete con {w}{a}{s}{d}"
  en: "Move with {w}{a}{s}{d}"
