# ============================================================
#  Subtitulo bilingue de ejemplo (generado automaticamente).
#  Archivo: config/mediaplayer/subtitulos/tutorial1.yml
# ============================================================
#
#  Reproducir en el juego (comando solo para OP/admin):
#
#    /playsubtitles @a minecraft 16 white bubble tutorial1
#                   |    |        |  |     |      |
#                   |    |        |  |     |      `- nombre del .yml (se autocompleta)
#                   |    |        |  |     `- fondo: none | faded | bubble | karaoke
#                   |    |        |  `- color del texto: white, black, red, green...
#                   |    |        `- tamano del texto (16 = normal)
#                   |    `- fuente: "minecraft" = nativa y rapida (recomendado).
#                   |               tambien Arial, Verdana, Poppins, etc. (TTF)
#                   `- jugadores objetivo (@a = todos)
#
#  El idioma se elige solo en cada cliente:
#    - juego en ingles (en_us, en_gb, ...) -> muestra el texto 'en'
#    - cualquier otro idioma               -> muestra el texto 'es'
#
#  Notas:
#    - Los tiempos start/end estan en segundos (admiten decimales).
#    - Maximo 3 lineas por subtitulo (el texto largo se corta solo).
#    - Para forzar un salto de linea escribe \n dentro del texto.
# ============================================================

posicion: abajo        # arriba | centro | abajo   (default: abajo)

lineas:
  - start: 1.0
    end: 4.0
    es: "Bienvenido al tutorial"
    en: "Welcome to the tutorial"

  - start: 4.0
    end: 8.0
    es: "Aqui aprenderas lo basico del servidor"
    en: "Here you will learn the server basics"

  - start: 8.0
    end: 12.0
    es: "Editame en config/mediaplayer/subtitulos\ny crea tus propios subtitulos"
    en: "Edit me in config/mediaplayer/subtitulos\nand create your own subtitles"
